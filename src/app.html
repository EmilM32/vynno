<!doctype html>

<html lang="%paraglide.lang%" data-theme="dark" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>

		<meta name="color-scheme" content="dark light" />
		<!-- The only theme-color tag: the script below and `applyTheme` both write to it. -->
		<meta name="theme-color" content="#0b1326" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />

		<title>Vynno</title>

		<script nonce="%sveltekit.nonce%">
			try {
				// Keys must match THEME_STORAGE_KEY / LEGACY_THEME_STORAGE_KEY in $lib/theme.
				var t = localStorage.getItem('vynno-theme') || localStorage.getItem('devtime-theme');
				if (t && /^[a-z][a-z0-9-]*$/.test(t)) {
					document.documentElement.setAttribute('data-theme', t);
					// Status bar before hydration. Must match THEMES[].themeColor (app-html.test.ts).
					var c = {
						dark: '#0b1326',
						light: '#f8f9ff',
						'deep-dark': '#131313',
						ember: '#17120e',
						newsprint: '#f2efe6',
						zen: '#1c1d21'
					}[t];
					if (c) document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
				}
			} catch (e) {}
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
