<!doctype html>

<html lang="%paraglide.lang%" data-theme="dark" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#0b1326" />

		<script>
			try {
				// Keys must match THEME_STORAGE_KEY / LEGACY_THEME_STORAGE_KEY in $lib/theme.
				var t = localStorage.getItem('vynno-theme') || localStorage.getItem('devtime-theme');
				if (t && /^[a-z][a-z0-9-]*$/.test(t)) {
					document.documentElement.setAttribute('data-theme', t);
				}
			} catch (e) {}
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />

		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>

		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
