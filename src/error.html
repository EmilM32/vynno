<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<title>%sveltekit.error.message% · Vynno</title>
		<script>
			try {
				var t = localStorage.getItem('vynno-theme') || localStorage.getItem('devtime-theme');
				if (t && /^[a-z][a-z0-9-]*$/.test(t)) {
					document.documentElement.setAttribute('data-theme', t);
				}
			} catch (e) {}
		</script>
		<!-- Palette subset — keep in sync with src/lib/theme/{dark,light,deep-dark}.css -->
		<style>
			:root,
			[data-theme='dark'] {
				color-scheme: dark;
				--surface: #0b1326;
				--on-surface: #dae2fd;
				--on-surface-variant: #bdc8d1;
				--outline-variant: #3e484f;
				--surface-container: #171f33;
				--primary: #8ed5ff;
				--on-primary: #00354a;
				--error: #ffb4ab;
			}
			[data-theme='light'] {
				color-scheme: light;
				--surface: #f8f9ff;
				--on-surface: #0b1c30;
				--on-surface-variant: #3f4850;
				--outline-variant: #bfc7d2;
				--surface-container: #e5eeff;
				--primary: #006194;
				--on-primary: #ffffff;
				--error: #ba1a1a;
			}
			[data-theme='deep-dark'] {
				color-scheme: dark;
				--surface: #131313;
				--on-surface: #e5e2e1;
				--on-surface-variant: #bac9cc;
				--outline-variant: #3b494c;
				--surface-container: #201f1f;
				--primary: #00e5ff;
				--on-primary: #00363d;
				--error: #ffb4ab;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 2.5rem 1rem;
				background: var(--surface);
				color: var(--on-surface);
				font-family: ui-sans-serif, system-ui, sans-serif;
			}
			.card {
				width: 100%;
				max-width: 24rem;
				border: 1px solid var(--outline-variant);
				border-radius: 0.5rem;
				background: var(--surface-container);
				padding: 1.5rem;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				margin-bottom: 1.5rem;
			}
			.brand svg {
				width: 2rem;
				height: 2rem;
				flex-shrink: 0;
				color: var(--primary);
			}
			.brand p {
				margin: 0;
				font-size: 1.125rem;
				line-height: 1.5rem;
				font-weight: 700;
				letter-spacing: -0.01em;
				color: var(--primary);
			}
			.status {
				margin: 0;
				font-family: ui-monospace, monospace;
				font-size: 1.75rem;
				line-height: 2rem;
				font-weight: 500;
			}
			.status.is-error {
				color: var(--error);
			}
			h1 {
				margin: 0.25rem 0 0;
				font-size: 1.125rem;
				line-height: 1.5rem;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			.body {
				margin: 0.5rem 0 0;
				font-size: 0.875rem;
				line-height: 1.25rem;
				color: var(--on-surface-variant);
			}
			.actions {
				margin-top: 1.25rem;
			}
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				min-height: 2.5rem;
				padding: 0.5rem 1rem;
				border-radius: 0.25rem;
				background: var(--primary);
				color: var(--on-primary);
				font: inherit;
				font-size: 0.875rem;
				line-height: 1.25rem;
				text-decoration: none;
			}
			.btn:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: 1px;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="brand">
				<svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
					<path d="M25.33 23.55A12 12 0 1 1 25.33 8.45L21.6 11.47A7.2 7.2 0 1 0 21.6 20.53Z" />
					<path d="M21.45 11.3L29.2 16L21.45 20.7L24.4 16Z" />
				</svg>
				<p>Vynno</p>
			</div>
			<p id="status" class="status" aria-hidden="true">%sveltekit.status%</p>
			<h1 id="heading">Something went wrong</h1>
			<p class="body">%sveltekit.error.message%</p>
			<div class="actions">
				<a class="btn" href="/">Go to Vynno</a>
			</div>
		</div>
		<script>
			(function () {
				var el = document.getElementById('status');
				var status = el && el.textContent.trim();
				if (!status) return;
				if (status === '404') {
					document.getElementById('heading').textContent = 'Page not found';
				} else {
					el.classList.add('is-error');
				}
			})();
		</script>
	</body>
</html>
