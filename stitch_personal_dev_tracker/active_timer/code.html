<style>
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .pulse-border {
            animation: borderPulse 2s infinite;
        }
        @keyframes borderPulse {
            0% { border-color: rgba(142, 213, 255, 0.2); box-shadow: 0 0 0 0 rgba(142, 213, 255, 0.4); }
            70% { border-color: rgba(142, 213, 255, 1); box-shadow: 0 0 0 10px rgba(142, 213, 255, 0); }
            100% { border-color: rgba(142, 213, 255, 0.2); box-shadow: 0 0 0 0 rgba(142, 213, 255, 0); }
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>

<body class="bg-background text-on-surface font-body-md h-screen flex flex-col overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant transition-colors duration-200 flex justify-between items-center px-4 h-14 w-full w-full top-0 sticky shrink-0 z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">terminal</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">DevTime</span>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-secondary-fixed blink text-xs" style="font-variation-settings: 'FILL' 1;">fiber_manual_record</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile md:px-margin-desktop py-6 pb-24 flex flex-col items-center justify-center relative">
<div class="w-full max-w-container-max md:max-w-[600px] flex flex-col gap-8">
<!-- Command Bar Input -->
<div class="relative group w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors">prompt_suggestion</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-code-data text-code-data pl-10 pr-4 py-3 placeholder:text-outline-variant transition-all outline-none" placeholder="What are you working on? (e.g. 'Fixing Bug #402')" type="text" value="Refactoring Auth Service"/>
</div>
<!-- Timer Card -->
<div class="bg-surface-container rounded-lg border border-primary pulse-border p-8 flex flex-col items-center justify-center relative shadow-lg">
<div class="absolute top-4 left-4 flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-secondary-fixed blink"></div>
<span class="font-code-label text-code-label text-secondary-fixed">ACTIVE</span>
</div>
<div class="absolute top-4 right-4">
<span class="px-2 py-1 bg-primary/10 text-primary border border-primary/20 rounded font-code-label text-code-label">PROJ: AUTH</span>
</div>
<div class="font-code-display text-code-display text-primary mt-6 mb-8 tabular-nums tracking-tight">
                    01:42:15
                </div>
<div class="flex gap-4 w-full max-w-[300px]">
<button class="flex-1 bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface font-headline-md text-headline-md py-2 rounded flex items-center justify-center gap-2 transition-colors">
<span class="material-symbols-outlined text-tertiary-fixed">pause</span>
                        Pause
                    </button>
<button class="flex-1 bg-primary hover:bg-primary-fixed-dim border border-transparent text-on-primary font-headline-md text-headline-md py-2 rounded flex items-center justify-center gap-2 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stop</span>
                        Stop
                    </button>
</div>
</div>
<!-- Quick Start / Recent Tasks -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between border-b border-outline-variant pb-2">
<h2 class="font-headline-md text-headline-md text-on-surface-variant">Recent Tasks</h2>
<span class="font-code-label text-code-label text-outline">Press [CMD+K] to search</span>
</div>
<div class="flex flex-col gap-2">
<!-- Task Item 1 -->
<button class="w-full text-left bg-surface-container hover:bg-surface-variant border border-outline-variant rounded p-3 flex items-center justify-between group transition-colors">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Refactoring Auth</span>
<span class="font-code-label text-code-label text-outline-variant">Project: Identity</span>
</div>
<div class="flex items-center gap-3">
<span class="font-code-data text-code-data text-on-surface-variant">2h 15m</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-all">play_arrow</span>
</div>
</button>
<!-- Task Item 2 -->
<button class="w-full text-left bg-surface-container hover:bg-surface-variant border border-outline-variant rounded p-3 flex items-center justify-between group transition-colors">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">UI Implementation</span>
<span class="font-code-label text-code-label text-outline-variant">Project: Frontend</span>
</div>
<div class="flex items-center gap-3">
<span class="font-code-data text-code-data text-on-surface-variant">45m</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-all">play_arrow</span>
</div>
</button>
<!-- Task Item 3 -->
<button class="w-full text-left bg-surface-container hover:bg-surface-variant border border-outline-variant rounded p-3 flex items-center justify-between group transition-colors">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Fixing Bug #402</span>
<span class="font-code-label text-code-label text-outline-variant">Project: Core API</span>
</div>
<div class="flex items-center gap-3">
<span class="font-code-data text-code-data text-on-surface-variant">1h 10m</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-all">play_arrow</span>
</div>
</button>
</div>
</div>
</div>

<span class="material-symbols-outlined mb-0.5">analytics</span>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-3 py-1 font-body-sm text-body-sm hover:text-primary dark:hover:text-primary scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined mb-0.5">settings</span>
